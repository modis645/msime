name: Fork device check (slim pinyin)
# fork 自用的设备验收：只验我们自己出的拼音瘦包（包名 app.msime.android.pinyin.modis、APK 名
# msime-android-pinyin.apk）。上游 android-device.yml 那一套从 smoke.sh 到测试 APK 的
# targetPackage 都写死 full 版 app.msime.android，对不上我们的包，所以这里另起一条，不改上游。
#
# 验什么：瘦包能不能装上、首启能不能把 7 项词库落到私有目录、装前/装后/首启后 /data 的真实占用、
# 键盘服务能不能被系统选中。打字主路径的用例等这套跑通之后再加。
on:
  workflow_dispatch:
    inputs:
      api:
        description: 模拟器 API 级别（瘦包 minSdk 28，35 是这里常用的最高级别）
        required: false
        default: '35'
        type: string
permissions:
  contents: read
jobs:
  device:
    name: Slim pinyin on API ${{ inputs.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      # 模拟器镜像是 x86_64（start-emulator.sh 按主机架构选），APK 跟着打 x86_64。
      MSIME_ANDROID_ABIS: x86_64
      MSIME_EDITION: pinyin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM for the emulator
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::需要 /dev/kvm 字符设备"
            exit 1
          fi
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --settle --name-match=/dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Free disk space for the emulator
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install tools, the pinned NDK and the emulator image
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils
          bash scripts/rustup-install.sh x86_64-linux-android
          bash platforms/android/install-ndk.sh
          bash platforms/android/install-sdk-packages.sh "${{ inputs.api }}"
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
      - name: Boot the dedicated AVD
        run: |
          set -euo pipefail
          mkdir -p target/android
          # shellcheck disable=SC2016 # $1 和 $? 要在内层 shell 里展开。
          nohup bash -c 'bash platforms/android/tests/device/start-emulator.sh "$1"; echo "start-emulator.sh exited with status $?"' _ ${{ inputs.api }} > target/android/emulator.log 2>&1 &
          serial="emulator-$((5580 - 2 * (35 - ${{ inputs.api }})))"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 600 "$adb" -s "$serial" wait-for-device
          timeout 600 bash -c "until [ \"\$('$adb' -s $serial shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = 1 ]; do sleep 5; done"
          "$adb" -s "$serial" shell getprop ro.build.version.sdk
          "$adb" -s "$serial" logcat -G 32M || true
      # 镜像改写：托管 runner 直连 msime-dictionary 的 Release 资产稳定 504，锁文件里的地址改走项目镜像
      # dl.msime.app/gh/；只放行这三个仓库，别的一律不动（改写 opencc.lock.json 会让 build.rs panic）。
      - name: Point locked GitHub resources at the project mirror
        run: |
          set -euo pipefail
          find resources -name '*.lock.json' -print0 | xargs -0 grep -l '"url"' \
            | while read -r file; do
                sed -i -E 's#"url":([[:space:]]*)"https://github\.com/(metasequoiaime/msime-dictionary|metasequoiaime/chinese-ime-lm|k2-fsa/sherpa-onnx)/#"url":\1"https://dl.msime.app/gh/https://github.com/\2/#g' "$file"
              done
          echo "rewritten files: $(grep -rl 'dl.msime.app' resources | wc -l)"
      - name: Build the slim pinyin APK
        run: |
          set -euo pipefail
          bash platforms/windows/bootstrap-vcpkg.sh
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources --locked -- target/resources)"
          bash platforms/android/build-apk.sh "$resource_dir"
      - name: Install, first launch, dictionary prep and real footprint on device
        run: |
          set -euo pipefail
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          serial="$SERIAL"
          package="$(python3 platforms/android/scripts/edition_android.py field --edition "$MSIME_EDITION" application_id)"
          apk="target/android/$(python3 platforms/android/scripts/edition_android.py field --edition "$MSIME_EDITION" apk_name).apk"
          # 清单里服务的类名是绝对名 app.msime.android.MSIMEInputService（Java 的 namespace 不跟
          # applicationId 变），所以 ime id 不能写成 `/.MSIMEInputService`，那样系统报 Unknown input method。
          ime_id="$package/app.msime.android.MSIMEInputService"
          home="$package/app.msime.android.home.HomeActivity"
          echo "package=$package apk=$apk"
          ls -l "$apk"

          # 装前 / 装后 / 首启后各量一次 /data 余量：差值就是真机上的安装占用与首启词库副本。
          data_free() { "$adb" -s "$serial" shell df -k /data | awk 'END{print $4}'; }
          before=$(data_free); echo "free before install: $before"
          "$adb" -s "$serial" install --no-streaming --no-incremental -r "$apk"
          after_install=$(data_free); echo "free after install: $after_install"
          echo "installed footprint KiB: $((before - after_install))" | tee target/android/footprint.txt
          "$adb" -s "$serial" shell dumpsys package "$package" | grep -E 'versionName|versionCode' || true

          # 输入法要能被系统选中：ime list -s 里出现短写 id 即成立。
          "$adb" -s "$serial" shell ime enable "$ime_id" || true
          "$adb" -s "$serial" shell ime set "$ime_id" || true
          "$adb" -s "$serial" shell ime list -s | tee target/android/ime-list.txt
          grep -qx "$ime_id" target/android/ime-list.txt

          # 首启：HomeActivity 起来后会把词库解到私有目录，等到 /data 余量稳定为止。
          "$adb" -s "$serial" shell am start -W -n "$home" || true
          stable=0; prev=-1
          for i in $(seq 1 60); do
            sleep 5
            now=$(data_free)
            if [[ "$now" == "$prev" ]]; then stable=$((stable + 1)); else stable=0; fi
            prev=$now
            echo "t+$((i * 5))s free=$now stable=$stable"
            if (( stable >= 6 )); then break; fi
          done
          after_launch=$(data_free); echo "free after first launch: $after_launch"
          echo "first-launch footprint KiB: $((after_install - after_launch))" | tee -a target/android/footprint.txt

          # 有没有致命错误：首启期间的 FATAL EXCEPTION / 词库准备失败都算失败。
          "$adb" -s "$serial" logcat -d > target/android/logcat-first-launch.txt 2>&1 || true
          if grep -E 'FATAL EXCEPTION|Dictionary|dictionary.*fail|resource.*fail' target/android/logcat-first-launch.txt | grep -vi 'dictionary=|dictionaryLoaded|no dictionary' | head -20; then
            echo "::warning::首启日志里出现可疑行，见 logcat-first-launch.txt"
          fi

          mkdir -p target/android/shots
          "$adb" -s "$serial" exec-out screencap -p > target/android/shots/home.png || true
          "$adb" -s "$serial" shell uiautomator dump /sdcard/home.xml >/dev/null 2>&1 || true
          "$adb" -s "$serial" shell cat /sdcard/home.xml > target/android/shots/home.xml 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fork-device-api${{ inputs.api }}
          path: |
            target/android/footprint.txt
            target/android/ime-list.txt
            target/android/logcat-first-launch.txt
            target/android/shots
            target/android/emulator.log
            target/apk-size
          if-no-files-found: ignore
      - name: Stop the AVD
        if: always() && env.SERIAL != ''
        run: 'timeout 15 "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$SERIAL" emu kill || true'
