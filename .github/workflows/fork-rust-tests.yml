name: Fork Rust tests

# 这个 fork 只出 Android，上游的 Core CI 跑的是 quality/contracts（不含 cargo test），真正跑
# cargo test 的 Native Platform CI 用的全是 depot 自托管 runner（depot-ubuntu-24.04-8 等），
# fork 里没有那些 runner，job 只会一直 queued。所以这里另起一个只用 GitHub 托管 ubuntu-latest
# 的窄工作流：只跑 Android 真正依赖、且不依赖资源包与设备的那几个 crate 的测试。

on:
  push:
    branches:
      - develop
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/fork-rust-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Engine, input runtime, client-core preferences
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # 安装 rust-toolchain.toml 钉住的工具链，与上游 Native Platform CI 的写法一致。
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # 引擎的拼音/双拼/五笔、候选切分、简拼混输排序都在这里，改动这三条之后靠它兜住行为回归。
      #
      # 有 19 条用例在 GitHub 托管 runner 上本来就红，与任何一次改动无关：把同一份工作流放到
      # 今天改动之前的树（90b9580f，运行 43453332131）上跑，同样是 3088 passed / 19 failed，
      # 失败的名字也一样。它们集中在「上屏后联想」（session::tests::next_word_prediction_*、
      # session::tests::prediction_pool::*）、句级排除（session::tests::sentence_excluded::*）、
      # caret_suffix 的词序断言，以及一条按分配次数计数的断言
      # （typing_at_a_caret_reuses_the_editing_text_length，166 对 164）。这些依赖随包的联想模型与
      # 词库顺序，在本仓库托管 runner 的布局下拿不到同样的结果，所以先按下不表，等上游把它们改成
      # 不依赖宿主的断言之后再放开——留着它们红着，只会让这个网连同真问题一起被人忽略。
      - name: Unit and golden tests for msime-engine
        run: |
          set -euo pipefail
          cargo test --locked -p msime-engine -- \
            --skip next_word_prediction \
            --skip prediction_pool:: \
            --skip sentence_excluded:: \
            --skip caret_suffix::choosing_a_suffix_word_consumes_its_syllables_and_keeps_editing_the_rest \
            --skip typing_at_a_caret_reuses_the_editing_text_length
      - name: Unit tests for msime-input-runtime
        run: cargo test --locked -p msime-input-runtime
      # 偏好键的单测只读写临时目录，不需要设备；上游把它挂在 Native Platform CI 的 Linux 作业上。
      - name: Preference unit tests for msime-client-core
        run: cargo test --locked -p msime-client-core --lib 'preferences::'
